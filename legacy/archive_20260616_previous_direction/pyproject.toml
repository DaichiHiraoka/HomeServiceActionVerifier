[project]
name = "home-service-action-verifier"
version = "0.1.0"
description = "Research experiment system for event-level home-service action verification."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "streamlit>=1.40",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
home-service-verifier = "home_service_action_verifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_service_action_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
